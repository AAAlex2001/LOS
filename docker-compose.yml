version: "3.9"

services:
  backend:
    build:
      context: ./admin
    container_name: los-admin
    volumes:
      - ./admin:/app  # Синхронизируем весь код admin
      - admin_data:/app/data  # Данные БД в отдельном volume
    environment:
      - DJANGO_ALLOWED_HOSTS=*
      - DJANGO_CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://109.196.103.12,http://109.196.103.12:3000,http://landofsoul-apsny.ru,https://landofsoul-apsny.ru,http://www.landofsoul-apsny.ru,https://www.landofsoul-apsny.ru
      - DJANGO_CSRF_TRUSTED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://109.196.103.12,http://109.196.103.12:3000,http://landofsoul-apsny.ru,https://landofsoul-apsny.ru,http://www.landofsoul-apsny.ru,https://www.landofsoul-apsny.ru
      - DJANGO_DEBUG=1
    expose:
      - "8000"

  frontend:
    build:
      context: ./my-next-app
    container_name: los-frontend
    environment:
      - NEXT_PUBLIC_API_BASE=/api
      - NEXT_PUBLIC_SITE_URL=https://landofsoul-apsny.ru
    expose:
      - "3000"
    depends_on:
      - backend

  proxy:
    image: nginx:1.27-alpine
    container_name: los-proxy
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"

volumes:
  admin_data: {}


