version: "3.9"

services:
  backend:
    build:
      context: ./admin
    container_name: los-admin
    volumes:
      - ./admin/media:/app/media
      - admin_data:/app/data
    environment:
      - DJANGO_ALLOWED_HOSTS=*
      - DJANGO_CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://109.196.103.12,http://109.196.103.12:3000
      - DJANGO_CSRF_TRUSTED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://109.196.103.12,http://109.196.103.12:3000
      - DJANGO_DEBUG=1
    expose:
      - "8000"

  frontend:
    build:
      context: ./my-next-app
    container_name: los-frontend
    environment:
      - NEXT_PUBLIC_API_BASE=/api
    expose:
      - "3000"
    depends_on:
      - backend

  proxy:
    image: nginx:1.27-alpine
    container_name: los-proxy
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    ports:
      - "3000:80"

volumes:
  admin_data: {}


