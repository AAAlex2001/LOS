# HTTP server - редирект на HTTPS
server {
  listen 80;
  server_name landofsoul-apsny.ru www.landofsoul-apsny.ru;
  
  # Let's Encrypt challenge
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }
  
  # Редирект на HTTPS
  location / {
    return 301 https://$server_name$request_uri;
  }
}

# HTTPS server
server {
  listen 443 ssl http2;
  server_name landofsoul-apsny.ru www.landofsoul-apsny.ru;

  # SSL конфигурация
  ssl_certificate /etc/letsencrypt/live/landofsoul-apsny.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/landofsoul-apsny.ru/privkey.pem;
  
  # SSL настройки безопасности
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  # Увеличиваем лимиты для загрузки файлов
  client_max_body_size 50M;
  client_body_timeout 60s;
  client_header_timeout 60s;

  # Admin and API to Django (catch both with/without trailing slash)
  location ^~ /admin {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Дополнительные настройки для загрузки файлов
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  location ^~ /api {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Дополнительные настройки для загрузки файлов
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  # Serve media directly with byte-range support for iOS AVPlayer
  location ^~ /media/ {
    alias /media/;
    access_log off;
    # Required for AVPlayer to seek/stream MP4
    add_header Accept-Ranges bytes;
    # Never gzip video content
    gzip off;
  }

  location ^~ /static/ {
    proxy_pass http://backend:8000;
  }

  # Administrative buildings to frontend (explicit)
  location ^~ /administrative-buildings/ {
    proxy_pass http://frontend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Frontend on root
  location / {
    proxy_pass http://frontend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}


